<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Toilet — 廁所互動體驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh; height: 100svh;   /* 手機：用 svh 避免被工具列截斷 */
    background: #000;
    overflow: hidden;
    font-family: "DotGothic16", "Courier New", monospace;
    touch-action: none;              /* 手機：停用捲動/縮放手勢 */
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; cursor: none; }

  /* 16:9 舞台，自動縮放貼合視窗 */
  #stage {
    position: relative;
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh; max-height: 100svh;
    max-width: 177.78vh; max-width: 177.78svh;
    background: #000;
    overflow: hidden;
  }

  /* 場景層 */
  .scene {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
  }
  .scene.active { opacity: 1; pointer-events: auto; }

  /* 熱區：預設透明，debug 模式顯示外框 */
  .hot { position: absolute; cursor: none; }
  body.debug .hot {
    outline: 2px dashed rgba(255,60,60,0.9);
    background: rgba(255,60,60,0.12);
  }
  /* 左上角常駐返回文字 */
  .hot.back {
    display: flex; align-items: center; justify-content: flex-start;
    padding: 0 6px; white-space: nowrap;
    font-size: clamp(12px, 1vw, 18px); letter-spacing: 2px;
    color: #fff; -webkit-text-stroke: 0; text-stroke: 0;
    cursor: url('cursor.png') 0 0, auto;   /* 僅 BACK 顯示像素箭頭 */
  }
  body.over-back #cursor { opacity: 0 !important; }   /* 在 BACK 上時隱藏跟隨文字 */

  /* 場景 C：掀蓋前後切換可見的熱區 */
  .when-open { display: none; }
  #scene-toilet.opened .when-open { display: block; }
  #scene-toilet.opened .when-closed { display: none; }

  /* PEE 堆積與沖水旋轉 */
  #pee-pile { position: absolute; inset: 0; pointer-events: none; z-index: 30; transform-origin: 49.3% 58.75%; }
  #pee-pile.flushing {
    transition: transform 1s cubic-bezier(.45,0,.9,.5), opacity 1s ease-in;
    transform: rotate(900deg) scale(0.05); opacity: 0;
  }
  .pee {
    position: absolute; transform: translate(-50%, -50%);
    color: #ffd21e; white-space: nowrap; letter-spacing: 1px;   /* 黃色 (PEE) */
    font-family: "DotGothic16", monospace; text-shadow: 0 0 2px #000, 0 0 4px #000;
  }
  /* 場景 D：WATER 水滴 */
  #water-pile { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
  .water {
    position: absolute; transform: translate(-50%, -50%);
    color: #1ea0ff; white-space: nowrap; letter-spacing: 1px;   /* 藍色 (WATER) */
    font-family: "DotGothic16", monospace; text-shadow: 0 0 2px rgba(0,0,0,.7);
  }
  /* 沖水提示（(PEE) 達門檻後出現） */
  #flush-hint {
    position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
    font-family: "DotGothic16", monospace; font-size: clamp(12px, 1.4vw, 22px); letter-spacing: 3px;
    color: #fff; text-shadow: 0 0 3px #000, 0 0 6px #000;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 35;
  }
  #flush-hint.on { opacity: 1; animation: fhpulse 1.1s ease-in-out infinite; }
  @keyframes fhpulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.08); } }

  /* 跟隨游標的文字 —— 用 difference 混色，黑白點點上永遠看得見 */
  #cursor {
    position: absolute; left: 0; top: 0;
    transform: translate(-50%, -50%);   /* 文字中心對齊滑鼠 (0,0) */
    font-weight: 700;
    font-size: clamp(12px, 1vw, 18px);   /* 約 18px，可再調 */
    letter-spacing: 2px;
    color: #000;                         /* 預設：純黑字、無外框 */
    -webkit-text-stroke: 0;
    text-stroke: 0;
    paint-order: stroke fill;
    pointer-events: none;
    white-space: nowrap;
    z-index: 50;
    transition: opacity 0.2s;
  }
  /* 依背景深淺切換：純白字、無外框 */
  body.inverted #cursor {
    color: #fff;
    -webkit-text-stroke: 0;
    text-stroke: 0;
  }
  /* 進入可點區：文字加 2px 反色外框 */
  #cursor.glow { -webkit-text-stroke: 2px #fff; text-stroke: 2px #fff; }              /* 黑字 → 白外框 */
  body.inverted #cursor.glow { -webkit-text-stroke: 2px #000; text-stroke: 2px #000; } /* 白字 → 黑外框 */
  /* 進入可點區時，文字後方浮現「與字反色」的柔光塊 */
  #cursor::before {
    content: ''; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 150%; height: 240%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.9), rgba(0,0,0,0) 70%);
    filter: blur(7px); z-index: -1; opacity: 0;
    transition: opacity 0.15s; pointer-events: none;
  }
  #cursor.glow::before { opacity: 1; }
  body.inverted #cursor::before {
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%);
  }
  /* (URGENCY) 時：後方紅色光暈脈動閃爍，增添緊急感 */
  #cursor.urgent::before {
    background: radial-gradient(ellipse at center, rgba(255,40,40,0.95), rgba(255,40,40,0) 70%) !important;
    animation: urgentPulse 0.7s ease-in-out infinite;
  }
  @keyframes urgentPulse {
    0%, 100% { opacity: 0.15; transform: translate(-50%,-50%) scale(0.8); }
    50%      { opacity: 1;    transform: translate(-50%,-50%) scale(1.25); }
  }
  /* (URGENCY) 小字以游標為中心微微向周圍噴出 */
  #urgency-burst { position: absolute; inset: 0; pointer-events: none; z-index: 49; overflow: hidden; }
  .ubit {
    position: absolute; transform: translate(-50%,-50%);
    font-family: "DotGothic16", monospace; white-space: nowrap;
    color: rgba(255,45,45,0.9); text-shadow: 0 0 2px rgba(0,0,0,0.5);
  }

  /* 手機：沖水提示可點；橫向提示 */
  body.touch #flush-hint.on { pointer-events: auto; }
  #rotate-hint {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #fff;
    font-family: "DotGothic16", monospace; font-size: 22px; line-height: 1.8; letter-spacing: 2px;
  }
  @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
    #rotate-hint { display: flex; }
  }

  /* 黑幕轉場 */
  #fade {
    position: absolute; inset: 0; background: #000;
    opacity: 0; pointer-events: none; z-index: 40;
    transition: opacity 0.5s ease;
  }
  #fade.on { opacity: 1; }

  /* 建置中提示 */
  #wip {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    color: #fff; mix-blend-mode: difference;
    font-size: clamp(12px,1.4vw,20px); letter-spacing: 3px;
    opacity: 0; transition: opacity 0.4s; z-index: 45; pointer-events: none;
    text-align: center;
  }
  #wip.on { opacity: 1; }

  #hint {
    position: absolute; left: 10px; bottom: 8px;
    color: #888; font-size: 11px; letter-spacing: 1px; z-index: 60;
  }
</style>
</head>
<body>
  <div id="stage">
    <!-- 場景 A：門 -->
    <div class="scene active" id="scene-door" data-src="door.jpg" style="background-image:url('door.jpg')">
      <div class="hot" id="hot-door" data-label="OPEN"
           style="left:40.5%; top:46%; width:7%; height:13.5%;"></div>
    </div>

    <!-- 場景 B：全景 HUB（馬桶 / 洗手台兩區；位置暫定，按 D 校正） -->
    <div class="scene" id="scene-hub" data-src="hub.jpg" style="background-image:url('hub.jpg')">
      <div class="hot" id="hot-sink" data-label="SINK"
           style="left:22%; top:38%; width:27%; height:25%;"></div>
      <div class="hot" id="hot-toilet" data-label="TOILET"
           style="left:55.5%; top:44%; width:13%; height:28%;"></div>
      <div class="hot back" data-label="← BACK" data-target="scene-door"
           style="left:3%; top:3.5%; width:7.7%; height:7.6%;">(← BACK)</div>
    </div>

    <!-- 場景 C：馬桶（掀蓋 → PEE 堆積 → 沖水；位置暫定，按 D 校正） -->
    <div class="scene" id="scene-toilet" data-src="toilet-closed.jpg" style="background-image:url('toilet-closed.jpg')">
      <div class="hot when-closed" id="hot-lift" data-label="LIFT"
           style="left:33%; top:2%; width:30%; height:86%;"></div>
      <div class="hot when-open" id="hot-bowl" data-label="PEE"
           style="left:10%; top:28%; width:85%; height:72%;"></div>
      <div id="pee-pile"></div>
      <div id="flush-hint">按 [SPACE] 沖水</div>
      <div class="hot back" data-label="← BACK" data-target="scene-hub"
           style="left:3%; top:3.5%; width:7.7%; height:7.6%;">(← BACK)</div>
    </div>

    <!-- 場景 D：洗手台（水龍頭 OPEN/CLOSE、WATER 撥水物理；位置暫定，按 D 校正） -->
    <div class="scene" id="scene-sink" data-src="sink.jpg" style="background-image:url('sink.jpg')">
      <div class="hot" id="hot-faucet" data-label="OPEN"
           style="left:46%; top:32%; width:8%; height:15%;"></div>
      <div id="water-pile"></div>
      <div class="hot back" data-label="← BACK"
           style="left:3%; top:3.5%; width:7.7%; height:7.6%;">(← BACK)</div>
    </div>

    <div id="urgency-burst"></div>
    <div id="cursor">(URGENCY)</div>
    <div id="fade"></div>
    <div id="wip"></div>
    <div id="hint">按 D 顯示 / 隱藏 熱區外框</div>
  </div>

  <div id="rotate-hint">請將手機橫置 📱↻<br><span style="font-size:15px;color:#aaa;">以獲得最佳體驗</span></div>

<script>
(function () {
  var stage  = document.getElementById('stage');
  var cursor = document.getElementById('cursor');
  var fade   = document.getElementById('fade');
  var wip    = document.getElementById('wip');

  var hint = document.getElementById('hint');

  // 全站狀態：常駐字 URGENCY -> RELIEF（沖水後）
  var state = { relieved: false };
  function idleWord() {
    if (state.relieved) return 'RELIEF';
    var sc = currentScene();
    if (sc && sc.id === 'scene-toilet' && sc.classList.contains('opened')) return 'PEE';
    return 'URGENCY';
  }
  function setCursor(word) { cursor.textContent = '(' + word + ')'; cursor.classList.toggle('urgent', word === 'URGENCY'); }
  function setInk(mode) { document.body.classList.toggle('inverted', mode === 'white'); }

  // ── 背景深淺取樣器 ──────────────────────────────────────────
  // 把場景圖大幅縮小畫到離屏 canvas（等於把點點模糊平均掉），
  // 再依游標位置取該區平均亮度 → 偏暗用白字、偏亮用黑字。
  // 圖與畫布同為 16:9，座標 1:1 對應，取樣精準。
  var SAMPLE_W = 140;    // 縮圖寬度：越小越模糊、越忽略單顆點
  var THRESHOLD = 128;   // 亮度門檻 0(黑)~255(白)
  var samplers = {};
  function getSampler(scene) {
    var url = scene.dataset.src;                 // 以圖檔網址為 key，換背景會重新取樣
    if (samplers[url]) return samplers[url];
    var s = { ready: false };
    samplers[url] = s;
    var img = new Image();
    img.onload = function () {
      var w = SAMPLE_W, h = Math.round(img.height / img.width * SAMPLE_W);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var cx = cv.getContext('2d', { willReadFrequently: true });
      cx.drawImage(img, 0, 0, w, h);
      s.cx = cx; s.w = w; s.h = h; s.ready = true;
      applyInk();
    };
    img.src = url;
    return s;
  }
  function inkFor(scene, xF, yF) {
    var s = getSampler(scene);
    if (!s.ready) return null;
    var px = Math.min(s.w - 1, Math.max(0, Math.round(xF * s.w)));
    var py = Math.min(s.h - 1, Math.max(0, Math.round(yF * s.h)));
    var x0 = Math.max(0, px - 1), y0 = Math.max(0, py - 1);
    var bw = Math.min(3, s.w - x0), bh = Math.min(3, s.h - y0);
    try {
      var d = s.cx.getImageData(x0, y0, bw, bh).data, sum = 0, n = 0;
      for (var i = 0; i < d.length; i += 4) { sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]; n++; }
      return (sum / n) < THRESHOLD ? 'white' : 'black';
    } catch (err) { return null; }   // file:// 直接開會被 CORS 擋，請用本地伺服器
  }

  var lastFrac = { x: 0.5, y: 0.5 };
  function currentScene() { return document.querySelector('.scene.active'); }
  function applyInk() {
    var mode = inkFor(currentScene(), lastFrac.x, lastFrac.y);
    if (mode) setInk(mode);
  }

  // 游標跟隨（+ 依背景深淺切字色；debug 模式右下顯示即時座標）
  stage.addEventListener('mousemove', function (e) {
    var r = stage.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    cursor.style.left = x + 'px';
    cursor.style.top  = y + 'px';
    lastFrac.x = x / r.width; lastFrac.y = y / r.height;
    applyInk();
    if (document.body.classList.contains('debug')) {
      hint.textContent = 'X ' + (lastFrac.x*100).toFixed(1) + '%   Y ' + (lastFrac.y*100).toFixed(1) + '%   （按 D 關閉）';
    }
  });
  window.addEventListener('mouseout', function (e) { if (!e.relatedTarget) cursor.style.opacity = 0; });
  window.addEventListener('mouseover', function () { cursor.style.opacity = 1; });

  // 熱區共用：hover 切字 + 高亮
  function wireHotspot(el, onClick) {
    el.addEventListener('mouseenter', function () {
      setCursor(el.dataset.label);
      cursor.classList.add('glow');
    });
    el.addEventListener('mouseleave', function () {
      setCursor(idleWord());
      cursor.classList.remove('glow');
    });
    if (onClick) el.addEventListener('click', onClick);
  }

  // 場景切換（黑幕漸暗淡入）
  function goScene(fromId, toId, afterReveal) {
    fade.classList.add('on');
    setTimeout(function () {
      document.getElementById(fromId).classList.remove('active');
      if (fromId === 'scene-sink') resetSink();     // 離開洗手台 → 停水聲、關水龍頭
      if (fromId === 'scene-toilet') resetToilet(); // 離開馬桶 → 停沖水聲、清理
      document.getElementById(toId).classList.add('active');
      applyInk();
      fade.classList.remove('on');
      if (afterReveal) afterReveal();
    }, 520);
  }

  function showWip(html) { wip.innerHTML = html; wip.classList.add('on'); }
  function hideWip() { wip.classList.remove('on'); }

  // A 門 -> B 全景
  wireHotspot(document.getElementById('hot-door'), function () {
    playDoor();
    goScene('scene-door', 'scene-hub', function () { setCursor(idleWord()); hideWip(); });
  });

  // B 全景 -> C 馬桶（每次進入重置為關蓋）
  wireHotspot(document.getElementById('hot-toilet'), function () {
    playClick();
    resetToilet();
    goScene('scene-hub', 'scene-toilet', function () { setCursor(idleWord()); hideWip(); });
  });
  wireHotspot(document.getElementById('hot-sink'), function () {
    playClick();
    resetSink();
    goScene('scene-hub', 'scene-sink', function () { setCursor(idleWord()); hideWip(); });
  });

  // 左上角 (← BACK)：hub 回門、馬桶/洗手台回全景（依 data-target）
  Array.prototype.forEach.call(document.querySelectorAll('.hot.back'), function (el) {
    var from = el.closest('.scene').id;
    var target = el.dataset.target || 'scene-hub';
    // BACK 上不顯示跟隨文字、恢復原生鼠標
    el.addEventListener('mouseenter', function () { document.body.classList.add('over-back'); cursor.classList.remove('glow'); });
    el.addEventListener('mouseleave', function () { document.body.classList.remove('over-back'); });
    el.addEventListener('click', function () {
      document.body.classList.remove('over-back');
      goScene(from, target, function () { setCursor(idleWord()); hideWip(); });
    });
  });

  // ── 場景 C 馬桶互動 ──────────────────────────────────────────
  var toiletScene = document.getElementById('scene-toilet');
  var pile = document.getElementById('pee-pile');
  var bowl = document.getElementById('hot-bowl');
  var flushHint = document.getElementById('flush-hint');

  // 馬桶內部橢圓範圍（%）；(PEE) 落點與堆積都限制在此橢圓內
  var BOWL = { cx: 50, cy: 58.7, rx: 11.4, ry: 26.3 };   // 綠色橢圓＝馬桶邊緣（最高處/邊界）
  var MAX_PEE = 400, FLUSH_MIN = 25, GRAV = 0.05;
  var DRAIN = { x: 50, y: 52 }, FILL_MAX = 8, ACC = 0.06, DAMP = 0.86;   // 藍色圈＝最低點（積水區/排水口）
  var SPEED = 1.5, ARC = 0.05, PILE_STRETCH = 1.5;   // SPEED=飛行速度、ARC=拋物線重力
  var particles = [], fillR = 2, rafId = null, pouring = null, flushRaf = null;

  function ellipseHalfW(y) {              // 在給定 y，橢圓允許的半寬
    var t = (y - BOWL.cy) / BOWL.ry, v = 1 - t * t;
    return v <= 0 ? 0 : BOWL.rx * Math.sqrt(v);
  }
  function placePee(p) { p.el.style.left = p.x + '%'; p.el.style.top = p.y + '%'; }

  function stopPour() { if (pouring) { clearInterval(pouring); pouring = null; stopPeeSound(); } }
  function resetToilet() {
    toiletScene.classList.remove('opened');
    toiletScene.dataset.src = 'toilet-closed.jpg';
    toiletScene.style.backgroundImage = "url('toilet-closed.jpg')";
    stopPour();
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (flushRaf) { cancelAnimationFrame(flushRaf); flushRaf = null; }
    stopFlushSound();                               // 離開時停沖水聲
    pile.classList.remove('flushing');
    pile.style.transform = ''; pile.style.opacity = '';
    pile.innerHTML = ''; particles = []; fillR = 2;
    flushHint.classList.remove('on');
  }

  // 掀蓋 LIFT（漸暗切換掀蓋圖）
  wireHotspot(document.getElementById('hot-lift'), function () {
    playLidSound();
    fade.classList.add('on');
    setTimeout(function () {
      toiletScene.classList.add('opened');
      toiletScene.dataset.src = 'toilet-open.jpg';
      toiletScene.style.backgroundImage = "url('toilet-open.jpg')";
      applyInk();
      fade.classList.remove('on');
      setCursor(idleWord());
    }, 520);
  });

  // 長按馬桶內：(PEE) 自游標位置生成、受重力落下、堆積於橢圓內
  function inPile(x, y) {                        // 是否已進入藍區堆積範圍（橢圓）
    var ux = x - DRAIN.x, uy = (y - DRAIN.y) / PILE_STRETCH;
    return Math.sqrt(ux * ux + uy * uy) <= fillR;
  }
  function settleAt(p) {                         // 堆積於藍區（沿接近方向、隨機深度填滿）
    var ux = p.x - DRAIN.x, uy = (p.y - DRAIN.y) / PILE_STRETCH, d = Math.sqrt(ux * ux + uy * uy) || 0.001;
    var rr = fillR * Math.sqrt(Math.random());
    p.x = DRAIN.x + (ux / d) * rr;
    p.y = DRAIN.y + (uy / d) * rr * PILE_STRETCH;
    p.settled = true;
    fillR = Math.min(fillR + 0.06, FILL_MAX);
  }
  function clampBowl(p) {                         // 限制在綠色橢圓（馬桶邊緣）內
    if (p.y > BOWL.cy + BOWL.ry) p.y = BOWL.cy + BOWL.ry;
    else if (p.y < BOWL.cy - BOWL.ry) p.y = BOWL.cy - BOWL.ry;
    var hw = ellipseHalfW(p.y);
    if (p.x < BOWL.cx - hw) p.x = BOWL.cx - hw;
    else if (p.x > BOWL.cx + hw) p.x = BOWL.cx + hw;
  }
  function inBowl(x, y) {                         // 是否在綠色橢圓內
    var ux = (x - BOWL.cx) / BOWL.rx, uy = (y - BOWL.cy) / BOWL.ry;
    return ux * ux + uy * uy <= 1;
  }

  // ── 音效（Web Audio 即時合成，無外部音檔） ──────────────────────
  var actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  // HTML5 音效導入 Web Audio 增益（可放大/縮小），統一響度至 ≈ −25 dBFS
  function route(el, gainVal) {
    var ctx = audio(); if (!ctx) return; el.volume = 1;
    try { var s = ctx.createMediaElementSource(el); var g = ctx.createGain(); g.gain.value = gainVal; s.connect(g); g.connect(ctx.destination); } catch (e) {}
  }
  var doorAudio = new Audio('door%20sound.mp3'); route(doorAudio, 0.36);      // 原 −16dB → −25
  function playDoor() { audio(); try { doorAudio.currentTime = 0; doorAudio.play(); } catch (e) {} }
  var peeAudio = new Audio('pee%20sound.mp3'); peeAudio.loop = true; route(peeAudio, 1.2);   // 原 −27dB → −25
  function startPeeSound() { audio(); try { peeAudio.currentTime = 0; peeAudio.play(); } catch (e) {} }
  function stopPeeSound() { try { peeAudio.pause(); } catch (e) {} }
  var flushAudio = new Audio('flush%20sound.mp3'); route(flushAudio, 2.0);    // 調大（peak 上限 ~2.16）
  function playFlushSound() { audio(); try { flushAudio.currentTime = 0; flushAudio.play(); } catch (e) {} }
  function stopFlushSound() { try { flushAudio.pause(); } catch (e) {} }
  var clickAudio = new Audio('mouse-click-.mp3'); route(clickAudio, 1.2);     // 點擊音效（短促，不拉滿以免破音）
  function playClick() { audio(); try { clickAudio.currentTime = 0; clickAudio.play(); } catch (e) {} }
  var lidAudio = new Audio('click-button.mp3'); route(lidAudio, 1.0);         // 掀蓋音效（已約 −25dB）
  function playLidSound() { audio(); try { lidAudio.currentTime = 0; lidAudio.play(); } catch (e) {} }
  // 水槽出水：Web Audio 緩衝無縫循環 + 去除頭尾靜音接縫（loopStart/loopEnd）
  var sinkBuffer = null, sinkLoop = { s: 0, e: 0 }, sinkSrc = null;
  (function () {
    var ctx = audio(); if (!ctx) return;
    fetch('sink%20sound.mp3').then(function (r) { return r.arrayBuffer(); })
      .then(function (ab) { return ctx.decodeAudioData(ab); })
      .then(function (buf) {
        sinkBuffer = buf;
        var d = buf.getChannelData(0), n = buf.length, th = 0.004, s = 0, e = n - 1;
        for (var i = 0; i < n; i++) { if (Math.abs(d[i]) > th) { s = i; break; } }
        for (var j = n - 1; j >= 0; j--) { if (Math.abs(d[j]) > th) { e = j; break; } }
        sinkLoop.s = s / buf.sampleRate; sinkLoop.e = (e + 1) / buf.sampleRate;
      }).catch(function () {});
  })();
  function startSinkSound() {
    var ctx = audio(); if (!ctx || !sinkBuffer || sinkSrc) return;
    sinkSrc = ctx.createBufferSource(); sinkSrc.buffer = sinkBuffer;
    sinkSrc.loop = true; sinkSrc.loopStart = sinkLoop.s; sinkSrc.loopEnd = sinkLoop.e;
    var g = ctx.createGain(); g.gain.value = 1.2;              // 調小
    sinkSrc.connect(g); g.connect(ctx.destination);
    sinkSrc.start(0, sinkLoop.s);
  }
  function stopSinkSound() { if (sinkSrc) { try { sinkSrc.stop(); } catch (e) {} sinkSrc = null; } }
  function playRelief() {                         // 完成：解脫大三和弦
    var ctx = audio(); if (!ctx) return; var t0 = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach(function (f, k) {
      var o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.075, t0 + 0.08 + k * 0.05);   // 調大（完成解脫和弦）
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.3);
      o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 1.35);
    });
  }
  // 長按：無論在哪點擊，(PEE) 都從游標「直線」射向藍區最低點，抵達後堆積
  function spawnPee() {
    if (particles.length >= MAX_PEE) return;
    var el = document.createElement('span');
    el.className = 'pee'; el.textContent = '(PEE)';
    el.style.fontSize = (13 + Math.random() * 10).toFixed(0) + 'px';   // 13–23px 隨機
    pile.appendChild(el);
    var x0 = lastFrac.x * 100, y0 = lastFrac.y * 100;
    var dx = DRAIN.x - x0, dy = DRAIN.y - y0, dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
    var T = Math.max(8, dist / SPEED);                               // 飛行幀數（依距離）
    var p = { el: el, x: x0, y: y0,
              vx: dx / T, vy: dy / T - 0.5 * ARC * T, settled: false };  // 稍朝上瞄準，靠重力彎成拋物線
    particles.push(p); placePee(p);
    if (particles.length >= FLUSH_MIN) flushHint.classList.add('on');
    if (!rafId) rafId = requestAnimationFrame(step);
  }
  function step() {
    var active = false;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i]; if (p.settled) continue;
      if (inPile(p.x, p.y)) { settleAt(p); placePee(p); continue; }   // 抵達藍區 -> 堆積
      p.vy += ARC;                                                    // 重力 -> 拋物線
      p.x += p.vx; p.y += p.vy;
      placePee(p);
      active = true;
    }
    rafId = active ? requestAnimationFrame(step) : null;
  }
  function startPour() { if (!pouring && toiletScene.classList.contains('opened')) { startPeeSound(); spawnPee(); pouring = setInterval(spawnPee, 85); } }
  wireHotspot(bowl);                       // hover 顯示 (PEE) + 柔光
  bowl.addEventListener('mousedown', startPour);
  bowl.addEventListener('mouseleave', stopPour);
  window.addEventListener('mouseup', stopPour);

  // 空白鍵沖水（(PEE) 達門檻後）：旋轉沖走 -> 永久轉 RELIEF
  function flush() {
    stopPour();
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    flushHint.classList.remove('on');
    state.relieved = true;
    setCursor('RELIEF'); cursor.classList.remove('glow');
    playFlushSound();                              // 沖水聲
    // (PEE) 螺旋捲入排水口（最低點）
    var swirl = particles.map(function (p) {
      var ux = p.x - DRAIN.x, uy = (p.y - DRAIN.y) / PILE_STRETCH;
      return { p: p, ang: Math.atan2(uy, ux), rad: Math.sqrt(ux * ux + uy * uy) };
    });
    var t0 = performance.now(), DUR = 2500;
    function anim(now) {
      var t = Math.min(1, (now - t0) / DUR);
      for (var i = 0; i < swirl.length; i++) {
        var s = swirl[i], ang = s.ang + t * Math.PI * 6, rad = s.rad * (1 - t);   // 旋轉 + 向排水口收縮
        s.p.el.style.left = (DRAIN.x + Math.cos(ang) * rad) + '%';
        s.p.el.style.top = (DRAIN.y + Math.sin(ang) * rad * PILE_STRETCH) + '%';
        s.p.el.style.opacity = (1 - t * 0.9);
      }
      if (t < 1) flushRaf = requestAnimationFrame(anim);
      else { flushRaf = null; pile.innerHTML = ''; particles = []; fillR = 2; stopFlushSound(); playRelief(); }   // 完成 -> 停沖水聲 + 解脫聲
    }
    flushRaf = requestAnimationFrame(anim);
  }

  // ── 場景 D 洗手台互動 ────────────────────────────────────────
  var faucet = document.getElementById('hot-faucet');
  var waterPile = document.getElementById('water-pile');
  var SPOUT = { x: 50, y: 52 };                    // 出水口（藍圈）
  var SDRAIN = { x: 50, y: 60 };                   // 綠色＝水槽最低點（排水口）
  var SINK = { cx: 50, cy: 63, rx: 20, ry: 28 };   // 水槽橢圓
  var W_ACC = 0.025, W_DAMP = 0.92, DRAIN_R = 2.5;    // 朝排水口的引力/阻尼/消失半徑
  var MOUSE_R = 6, MOUSE_F = 0.5, MAX_WATER = 140;    // 撥水半徑/力道、上限
  var waters = [], waterTimer = null, waterRaf = null, flowing = false;

  function placeWater(w) { w.el.style.left = w.x + '%'; w.el.style.top = w.y + '%'; }
  function clampSink(w) {                           // 限制在水槽橢圓內（撞壁減速）
    var ux = (w.x - SINK.cx) / SINK.rx, uy = (w.y - SINK.cy) / SINK.ry, d = ux * ux + uy * uy;
    if (d > 1) { var s = 1 / Math.sqrt(d); w.x = SINK.cx + (w.x - SINK.cx) * s; w.y = SINK.cy + (w.y - SINK.cy) * s; w.vx *= 0.4; w.vy *= 0.4; }
  }
  function spawnWater() {
    if (waters.length >= MAX_WATER) return;
    var el = document.createElement('span');
    el.className = 'water'; el.textContent = '(WATER)';
    el.style.fontSize = (11 + Math.random() * 6).toFixed(0) + 'px';
    waterPile.appendChild(el);
    var w = { el: el, x: SPOUT.x + (Math.random() - 0.5) * 3, y: SPOUT.y,
              vx: (Math.random() - 0.5) * 0.3, vy: 0.25 + Math.random() * 0.15, op: 1, gone: false };
    waters.push(w); placeWater(w);
    if (!waterRaf) waterRaf = requestAnimationFrame(stepWater);
  }
  function stepWater() {
    var mx = lastFrac.x * 100, my = lastFrac.y * 100, active = false;
    for (var i = waters.length - 1; i >= 0; i--) {
      var w = waters[i];
      if (w.gone) {                                  // 抵達排水口 → 快速淡出消失
        w.op -= 0.15; w.el.style.opacity = Math.max(0, w.op);
        if (w.op <= 0) { w.el.remove(); waters.splice(i, 1); } else active = true;
        continue;
      }
      var dx = w.x - mx, dy = w.y - my, dm = Math.sqrt(dx * dx + dy * dy);   // 滑鼠撥水（斥力）
      if (dm < MOUSE_R && dm > 0.001) { var f = MOUSE_F * (1 - dm / MOUSE_R); w.vx += dx / dm * f; w.vy += dy / dm * f; }
      var gx = SDRAIN.x - w.x, gy = SDRAIN.y - w.y, gd = Math.sqrt(gx * gx + gy * gy) || 0.001;
      if (gd <= DRAIN_R) { w.gone = true; active = true; continue; }        // 到排水口
      w.vx += gx / gd * W_ACC; w.vy += gy / gd * W_ACC;                     // 朝最低點流動
      w.vx *= W_DAMP; w.vy *= W_DAMP;
      w.x += w.vx; w.y += w.vy;
      clampSink(w);
      placeWater(w);
      active = true;
    }
    waterRaf = active ? requestAnimationFrame(stepWater) : null;
  }
  function startWater() { if (!waterTimer) { startSinkSound(); spawnWater(); waterTimer = setInterval(spawnWater, 55); } }
  function stopWater() { if (waterTimer) { clearInterval(waterTimer); waterTimer = null; stopSinkSound(); } }
  function resetSink() {
    stopWater(); flowing = false; faucet.dataset.label = 'OPEN';
    if (waterRaf) { cancelAnimationFrame(waterRaf); waterRaf = null; }
    waterPile.innerHTML = ''; waters = [];
  }
  wireHotspot(faucet, function () {                 // 水龍頭 OPEN / CLOSE 切換
    flowing = !flowing;
    faucet.dataset.label = flowing ? 'CLOSE' : 'OPEN';
    setCursor(faucet.dataset.label);
    if (flowing) startWater(); else stopWater();
  });

  // Debug：按 D 顯示熱區外框
  document.addEventListener('keydown', function (e) {
    if (e.key === 'd' || e.key === 'D') {
      var on = document.body.classList.toggle('debug');
      if (!on) hint.textContent = '按 D 顯示 / 隱藏 熱區外框';
    }
    if (e.code === 'Space' &&
        currentScene() && currentScene().id === 'scene-toilet' &&
        toiletScene.classList.contains('opened') &&
        particles.length >= FLUSH_MIN &&
        !pile.classList.contains('flushing')) {
      e.preventDefault();
      flush();
    }
  });

  // (URGENCY) 小字噴發：以游標為中心微微向周圍散開再淡出
  var burst = document.getElementById('urgency-burst');
  function spawnUrgencyBit() {
    if (!cursor.classList.contains('urgent') || cursor.style.opacity === '0' || document.body.classList.contains('over-back')) return;
    var x0 = lastFrac.x * 100, y0 = lastFrac.y * 100;
    var el = document.createElement('span');
    el.className = 'ubit'; el.textContent = '(URGENCY)';
    el.style.fontSize = (7 + Math.random() * 4).toFixed(0) + 'px';
    el.style.left = x0 + '%'; el.style.top = y0 + '%'; el.style.opacity = '0.85';
    burst.appendChild(el);
    var ang = Math.random() * Math.PI * 2, dist = 3 + Math.random() * 4;
    var nx = x0 + Math.cos(ang) * dist, ny = y0 + Math.sin(ang) * dist;
    void el.offsetWidth;   // 強制 reflow → 靜止不動時也能觸發過渡動畫
    el.style.transition = 'left .6s ease-out, top .6s ease-out, opacity .6s ease-out, transform .6s ease-out';
    el.style.left = nx + '%'; el.style.top = ny + '%';
    el.style.opacity = '0'; el.style.transform = 'translate(-50%,-50%) scale(0.5)';
    setTimeout(function () { el.remove(); }, 650);
  }
  setInterval(spawnUrgencyBit, 110);

  // ── 觸控（手機）支援：偵測 + touch 對應（方案 B：直接點）──────────
  var TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;
  function enableTouch() { if (!TOUCH) { TOUCH = true; } document.body.classList.add('touch'); updateFlushHint(); }
  if (TOUCH) enableTouch();
  window.addEventListener('touchstart', function () { audio(); enableTouch(); }, { passive: true, capture: true });

  function updateFlushHint() { flushHint.textContent = TOUCH ? '點此沖水' : '按 [SPACE] 沖水'; }
  updateFlushHint();

  var tsx = 0, tsy = 0, tMoved = false;
  function touchApply(e) {                          // 更新游標位置/字/取樣，回傳手指下的熱區
    var t = e.touches[0] || e.changedTouches[0], r = stage.getBoundingClientRect();
    var x = t.clientX - r.left, y = t.clientY - r.top;
    cursor.style.left = x + 'px'; cursor.style.top = y + 'px'; cursor.style.opacity = 1;
    lastFrac.x = x / r.width; lastFrac.y = y / r.height;
    applyInk();
    var under = document.elementFromPoint(t.clientX, t.clientY);
    var hot = under && under.closest ? under.closest('.hot') : null;
    if (hot && hot.dataset.label && !hot.classList.contains('back')) { setCursor(hot.dataset.label); cursor.classList.add('glow'); }
    else { setCursor(idleWord()); cursor.classList.remove('glow'); }
    return { t: t, under: under, hot: hot };
  }
  stage.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var info = touchApply(e);
    tsx = info.t.clientX; tsy = info.t.clientY; tMoved = false;
    if (info.hot && info.hot.id === 'hot-bowl') startPour();   // 按住馬桶 → 尿尿
  }, { passive: false });
  stage.addEventListener('touchmove', function (e) {
    e.preventDefault();
    var info = touchApply(e);
    if (Math.abs(info.t.clientX - tsx) > 8 || Math.abs(info.t.clientY - tsy) > 8) tMoved = true;
  }, { passive: false });
  function onTouchEnd(e) {
    stopPour();
    var t = e.changedTouches[0];
    var under = document.elementFromPoint(t.clientX, t.clientY);
    var hot = under && under.closest ? under.closest('.hot') : null;
    if (!tMoved) {                                   // 輕點（非拖曳）→ 觸發動作
      if (under && under.id === 'flush-hint' && flushHint.classList.contains('on')) flush();
      else if (hot) hot.dispatchEvent(new MouseEvent('click'));
    }
    cursor.classList.remove('glow'); setCursor(idleWord());
  }
  stage.addEventListener('touchend', onTouchEnd);
  stage.addEventListener('touchcancel', onTouchEnd);

  // 初始把游標文字放畫面中央（手機未觸控前也看得到 (URGENCY)）
  (function () { var r = stage.getBoundingClientRect(); cursor.style.left = (r.width / 2) + 'px'; cursor.style.top = (r.height / 2) + 'px'; })();

  setCursor(idleWord());
  applyInk();
})();
</script>
</body>
</html>
